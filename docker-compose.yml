services:
  aegis-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=1709
      - AEGIS_STATE_FILE=/app/data/.aegis_operational_state.json
      - AEGIS_CORS_ORIGINS=http://localhost:1708,http://127.0.0.1:1708,http://localhost:1709,http://127.0.0.1:1709,http://localhost:5173
    ports:
      - "127.0.0.1:1709:1709"
    volumes:
      - aegis_state:/app/data
      # Read-only host config mounts so on-demand SC Posture Scan inspects real host files
      - /etc/ssh:/etc/ssh:ro
      - /etc/issue.net:/etc/issue.net:ro
      - /etc/modprobe.d:/etc/modprobe.d:ro
      - /etc/crontab:/etc/crontab:ro
      - /var/log:/var/log:ro
    cap_add:
      - DAC_READ_SEARCH
    mem_limit: 192m
    mem_reservation: 64m
    cpus: 0.50

  aegis-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: aegis-dashboard
    restart: unless-stopped
    depends_on:
      aegis-backend:
        condition: service_healthy
    ports:
      - "1708:1708"
    mem_limit: 64m
    mem_reservation: 16m
    cpus: 0.25

  # Optional: Linux Host Telemetry Collector container (enable with: docker compose --profile collector up -d)
  # Note: For 100% native systemd/journalctl/ufw visibility on Ubuntu, running collector.py directly on the host
  # via systemd is recommended, or use this container with host read-only passthrough mounts below.
  aegis-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-collector
    profiles:
      - collector
    restart: unless-stopped
    pid: "host"
    cap_add:
      - DAC_READ_SEARCH
      - NET_ADMIN
    env_file:
      - .env
    environment:
      - AEGIS_API_URL=http://aegis-dashboard:1708/api
      - AEGIS_CURSOR_FILE=/app/data/.collector_cursor
      - AEGIS_LOG_FILES=/var/log/nginx/access.log,/var/log/apache2/access.log,/var/log/audit/audit.log
    command: ["python", "aegis_agent/collector.py"]
    depends_on:
      aegis-dashboard:
        condition: service_healthy
    volumes:
      - aegis_state:/app/data
      - /var/log:/var/log:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/ssh:/etc/ssh:ro
      - /etc/issue.net:/etc/issue.net:ro
      - /etc/modprobe.d:/etc/modprobe.d:ro
      - /etc/crontab:/etc/crontab:ro
    mem_limit: 48m
    mem_reservation: 16m
    cpus: 0.20

volumes:
  aegis_state:
